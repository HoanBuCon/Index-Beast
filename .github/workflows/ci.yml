name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Service thật cho test có marker `integration`
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: indexbeast
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: indexbeast
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U indexbeast" --health-interval 5s --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
        options: --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://indexbeast:change-me@localhost:5432/indexbeast
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/*.txt
      - run: python -m pip install pip==26.2.1
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Integration tests
        run: pytest -m integration

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  bot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
