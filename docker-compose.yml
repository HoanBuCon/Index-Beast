# Dev:  docker compose up -d postgres qdrant redis      (api/web/bot chạy local, xem README)
# Prod: docker compose --profile app up -d --build
# Cổng chỉ mở trên 127.0.0.1 — ra Internet duy nhất qua Caddy (80/443).

name: index-beast

# Mặc định KHÔNG ghi log container xuống đĩa (driver none). Cần xem log để debug:
#   DOCKER_LOG_DRIVER=local docker compose up -d   → `docker compose logs` dùng được, xoay vòng 5×20MB
x-common: &common
  restart: unless-stopped
  logging:
    driver: ${DOCKER_LOG_DRIVER:-none}

services:
  postgres:
    <<: *common
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indexbeast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-indexbeast}
    command: ["postgres", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql   # PG 18: mount thư mục cha, không phải .../data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    mem_limit: 1g

  qdrant:
    <<: *common
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant:/qdrant/storage
    ports: ["127.0.0.1:6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 10
    mem_limit: 1g

  redis:
    <<: *common
    image: redis:8.10.2-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 192m

  api:
    <<: *common
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-indexbeast}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-indexbeast}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data      # dữ liệu crawl thô
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      start_period: 60s
      retries: 5
    mem_limit: 3g

  bot:
    <<: *common
    profiles: ["app"]
    build: ./bot
    env_file: .env
    environment:
      BOT_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 192m

  caddy:
    <<: *common
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
    depends_on: [api]
    mem_limit: 64m

volumes:
  pgdata:
  qdrant:
  caddy_data:
